default: openai
theme: workbench
# 权限模式：locked / read_only / default / lenient / trust_all / plan
# default：READ 自动放行，WRITE/COMMAND 需人工确认；plan：计划目录写入放行，其余同 default
permission_mode: default
# 上下文管理（可选，缺省用默认值）：
# window_tokens: 窗口 token 上限，逼近它时自动全量摘要压缩
# compact_ratio: 触发比例（历史达到 window_tokens × 比例时压缩），默认 0.8
# single_result_threshold: 单条工具结果超过该字节数时完整内容存盘，对话只留预览+路径
# round_total_threshold: 单轮所有工具结果合计超过该字节数时，按大小从大到小依次存盘
# max_consecutive_summary_failures: 摘要连续失败达该次数后熔断，停止自动压缩
#context:
#  window_tokens: 200000
#  compact_ratio: 0.8
#  single_result_threshold: 4096
#  round_total_threshold: 32768
#  max_consecutive_summary_failures: 3

# 跨会话记忆系统（可选，缺省用默认值）：
# enabled: 是否启用记忆系统，默认 true
# extract_interval_rounds: 每 N 轮对话触发一次自动记忆提取，默认 5
# memory_max_chars: 单条记忆/指令注入内容的大小上限（字符数），默认 16384
# include_max_depth: @include 嵌套深度上限，默认 3
# session_idle_hours: 会话空闲超时阈值（小时），超过后恢复时插入时间提醒，默认 24
# session_archive: 是否开启会话存档，默认 true
#memory:
#  enabled: true
#  extract_interval_rounds: 5
#  memory_max_chars: 16384
#  include_max_depth: 3
#  session_idle_hours: 24
#  session_archive: true
providers:
  # OpenAI 兼容接口：base_url 填 API 根地址，程序会追加 /chat/completions。
  # 例如服务商给出的完整地址是 https://example.com/v1/chat/completions，
  # 这里应填写 https://example.com/v1，而不是完整请求地址。
  - name: openai
    protocol: openai
    model: YOUR_MODEL_ID
    base_url: https://your-provider.example/v1
    # API Key 每次启动后在工作台填写，仅用于本次运行，不写入配置。
# MCP Server 声明：取消注释后 ZenCode 自动连接、握手、发现并注册其工具（工具名形如「server名:工具名」）
# transport: stdio（本地子进程）或 http（远程 Server）；stdio 必填 command，http 必填 url
# env/headers 的值支持 ${ENV_NAME} 引用宿主环境变量；stdio 子进程只继承 PATH + env 显式声明的变量
# timeout: 调用超时（毫秒），缺省 30000
# 注意：引用的环境变量未设置时启动会报配置错误；默认保持注释，未配置 MCP 也能正常启动
#mcp_servers:
